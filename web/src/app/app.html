<header class="topbar">
  <a routerLink="/" class="brand">
    <img src="icons/mark.svg" alt="" width="28" height="28" />
    <span>Chaptick</span>
  </a>
 <nav class="top-actions" [attr.aria-label]="'app.mainNav' | transloco">
  <a routerLink="/sc/collections" routerLinkActive="active" class="lang">
    <app-icon name="book-open" />
    <span>{{ 'collections.short' | transloco }}</span>
  </a>
  <button type="button" class="lang" (click)="toggleLang()" [attr.aria-label]="'app.switchLanguage' | transloco">
    <app-icon name="languages" />
    {{ lang.lang() === 'pt' ? 'EN' : 'PT' }}
  </button>
 </nav>
</header>

@if (update.updateReady()) {
  <div class="update" role="status">
    <app-icon name="sparkles" />
    <span>{{ 'app.updateReady' | transloco }}</span>
    <button type="button" class="link" (click)="update.reload()">{{ 'app.reload' | transloco }}</button>
  </div>
}

<main class="page">
  <router-outlet />
</main>

<footer class="footer">
  <nav [attr.aria-label]="'app.footerNav' | transloco">
    <a routerLink="/credits">{{ 'credits.title' | transloco }}</a>
    <a routerLink="/credits" fragment="support"><app-icon name="heart" /> {{ 'app.support' | transloco }}</a>
    <a routerLink="/privacy">{{ 'privacy.title' | transloco }}</a>
  </nav>
  <p>{{ 'app.disclaimer' | transloco }}</p>
</footer>
